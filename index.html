<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
    <title>OWNER MARUF 🕷</title>

    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #020205; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-user-select:none; user-select:none; }
        .bg-animation { position:absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(transparent 95%, rgba(212,175,55,.05) 50%); background-size:30px 30px; z-index:0; }
        .iframe-container { position:absolute; top:0; left:0; width:100%; height:100%; z-index:1; }
        iframe { width:100%; height:100%; border:none; background:#000; }
        
        /* Premium Box Container */
        .box-container { position:fixed; top:100px; left:15px; width:195px; z-index:9999; touch-action:none; }
        .box-container::before { content:''; position:absolute; top:-2px; left:-2px; right:-2px; bottom:-2px; background:linear-gradient(45deg,#d4af37,#fff8dc,#d4af37); border-radius:14px; z-index:-1; filter: blur(2px); }
        
        .box { position: relative; border-radius:12px; border:1px solid rgba(212,175,55,0.4); text-align: center; overflow: hidden; background: #000; box-shadow: inset 0 0 15px rgba(0,0,0,0.8); }
        
        /* Box Content Wrapper */
        .box-content { position: relative; z-index: 1; padding: 12px; background: rgba(0, 0, 0, 0.35); }
        
        .box-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; border-bottom:1px solid rgba(212,175,55,0.3); padding-bottom:6px; }
        .header-left { display:flex; align-items:center; gap:6px; }
        
        /* Logo & Telegram matched sizes */
        .header-logo { width:24px; height:24px; border-radius:50%; border:1.5px solid #d4af37; object-fit: cover; }
        .title { font-size:10px; font-weight:900; color:#d4af37; }
        .tg-link { width:24px; height:24px; border-radius:50%; border:1.5px solid #d4af37; background: rgba(0,0,0,0.8); display:flex; align-items: center; justify-content: center; text-decoration:none; box-sizing: border-box; } 
        .tg-link img { width:12px; height:12px; }
        
        .small-box { background: rgba(0,0,0,0.7); border: 1px solid rgba(212,175,55,0.4); border-radius: 8px; padding: 5px; margin-bottom: 6px; }
        .label-text { font-size: 8px; color: #aaa; text-transform: uppercase; font-weight: bold; }
        .val-text { font-size: 15px; font-weight: 900; color: #d4af37; text-shadow: none; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        
        input { width:88%; padding:8px; background:rgba(0,0,0,0.8); border:1.5px solid #d4af37; border-radius:8px; color:#d4af37; margin-bottom:10px; font-size:11px; text-align:center; outline:none; font-weight:bold; }
        .btn-login { width:100%; padding:10px; border-radius:10px; border:none; font-size:11px; font-weight:bold; background:linear-gradient(to right, #d4af37, #fcf6ba, #d4af37); color:#000; cursor:pointer; }
        
        /* WIN/LOSS Overlay & Fireworks Canvas */
        #resultOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100000; pointer-events: none; }
        #fireworksCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100001; pointer-events: none; }
        .big-result-text { font-size: 90px; font-weight: 900; z-index: 100002; text-shadow: 0 0 20px rgba(0,0,0,0.8); }
        
        /* History Panel */
        #historyPanel { position:fixed; top:120px; right:15px; width:220px; background:rgba(10,10,12,0.98); border-radius:12px; color:#fff; padding:12px; border:1.5px solid #d4af37; z-index:10000; display:none; touch-action:none; }
        #histList { max-height: 250px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #d4af37 #222; } 
        .hist-item { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 900; padding: 8px 5px; border-bottom: 1px solid #222; }
        
        .status-dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; line-height: 14px; text-align: center; font-weight: bold; color: #fff; font-size: 8px; }
        .win-dot { background: #00b300; }
        .loss-dot { background: #cc0000; }
        
        .action-row { display:flex; gap:6px; margin-top:10px; }
        .btn-small { flex:1; padding:8px; font-size:10px; border-radius:8px; border:none; color:#000; font-weight:bold; cursor:pointer; background:linear-gradient(to right, #d4af37, #fcf6ba); }
        .btn-hide { background: rgba(50,50,50,0.9); color: #fff; }
        
        .num-dot { display: inline-block; width: 18px; height: 18px; border-radius: 50%; line-height: 18px; font-size: 11px; margin: 0 2px; color: #fff; font-weight: bold; border: 1px solid #d4af37; }
        
        .red { color: #ff4d4d; }
        .green { color: #00e676; }

        /* FAB Icon */
        #floatingLogoWrapper { 
            position: fixed; top: 40%; left: 10px; width: 55px; height: 55px; 
            z-index: 10000; display: none; touch-action: none; cursor: pointer; 
        }
        .rgb-ring {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%;
            background: conic-gradient(#ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
            animation: spinRGB 2s linear infinite; box-shadow: 0 0 15px rgba(255,255,255,0.4);
        }
        .fab-img-wrapper {
            position: absolute; top: 3px; left: 3px; right: 3px; bottom: 3px; background: #000;
            border-radius: 50%; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        .fab-img-wrapper img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        @keyframes spinRGB { 100% { transform: rotate(360deg); } }
        
        /* Music Button */
        .music-fab { 
            position:fixed; bottom:30px; right:20px; width:45px; height:45px; 
            background: linear-gradient(135deg, #111, #333); 
            border:2px solid #d4af37; border-radius:50%; 
            display:flex; justify-content:center; align-items:center; 
            z-index:10001; cursor:pointer; font-size:20px; touch-action: none; 
            box-shadow: 0 0 15px rgba(212,175,55,0.6); outline: none; padding: 0; color: #fff;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .music-fab.playing {
            box-shadow: 0 0 25px rgba(212,175,55,1);
            animation: rotateGlow 3s linear infinite;
        }
        @keyframes rotateGlow { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
    </style>
</head>

<body>
    <div class="bg-animation"></div>
    <div class="iframe-container">
        <iframe id="gameIframe" src=""></iframe>
    </div>

    <div id="resultOverlay">
        <canvas id="fireworksCanvas"></canvas>
        <div id="resultText" class="big-result-text">WIN</div>
    </div>

    <div class="box-container" id="mainContainer">
        <div class="box">
            <div class="box-content">
                <div class="box-header">
                    <div class="header-left">
                        <img src="https://files.catbox.moe/1hj11n.jpg" class="header-logo">
                        <div class="title">OWNER MARUF 🕷</div>
                    </div>
                    <a href="https://t.me/mkofficial32" target="_blank" class="tg-link">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg">
                    </a>
                </div>

                <div id="loginSection">
                    <input type="text" id="passInput" placeholder="ENTER KEY">
                    <button class="btn-login" id="loginBtn">LOGIN</button>
                </div>

                <div id="signalSection" style="display:none;">
                    <div class="small-box">
                        <div class="label-text">PERIOD ID</div>
                        <div id="periodVal" class="val-text" style="color: #fff;">#-------</div>
                    </div>
                    <div class="grid-2">
                        <div class="small-box">
                            <div class="label-text">SIGNAL</div>
                            <div id="signalResult" class="val-text">WAITING</div>
                        </div>
                        <div class="small-box">
                            <div class="label-text">NUMBER</div>
                            <div id="numDisplay">-</div>
                        </div>
                    </div>
                    <div style="font-size:11px; color:#fff; font-weight: bold; margin-top:5px;">
                        TIME: <span id="timerCount" style="color:#d4af37;">00</span>s
                    </div>
                </div>

                <div class="action-row">
                    <button class="btn-small btn-hide" id="hideBtn">HIDE</button>
                    <button class="btn-small" id="historyBtn">HISTORY</button>
                </div>
            </div>
        </div>
    </div>

    <div id="floatingLogoWrapper">
        <div class="rgb-ring"></div>
        <div class="fab-img-wrapper">
            <img src="https://files.catbox.moe/1hj11n.jpg">
        </div>
    </div>

    <div class="music-fab" id="musicBtn">🎵</div>

    <div id="historyPanel">
        <div style="text-align:center; font-size:11px; color:#d4af37; border-bottom:1px solid #444; padding-bottom:5px; font-weight:bold;">
            PREDICTION HISTORY
            <span style="float:right; cursor:pointer; color:#fff;" onclick="toggleHistory()">✖</span>
        </div>
        <div id="histList"></div>
    </div>

    <script>
        const MANUAL_PASSWORD = "maruf999"; 
        const TELEGRAM_LINK = "https://t.me/mkofficial32";

        let currentDisplayPeriod = "";
        let lastPredictedPeriod = "";
        let lastPredictedSignal = "";
        let apiInterval = null;
        let timerInterval = null;
        window.isDraggingFlag = false;

        const patternLogic = {
            "0+0":"BIG","0+1":"SMALL","0+2":"BIG","0+3":"SMALL","0+4":"BIG","0+5":"SMALL","0+6":"SMALL","0+7":"BIG","0+8":"BIG","0+9":"SMALL",
            "1+0":"BIG","1+1":"BIG","1+2":"SMALL","1+3":"SMALL","1+4":"BIG","1+5":"BIG","1+6":"BIG","1+7":"SMALL","1+8":"SMALL","1+9":"BIG",
            "2+0":"BIG","2+1":"BIG","2+2":"BIG","2+3":"SMALL","2+4":"BIG","2+5":"BIG","2+6":"BIG","2+7":"SMALL","2+8":"BIG","2+9":"BIG",
            "3+0":"BIG","3+1":"SMALL","3+2":"BIG","3+3":"BIG","3+4":"BIG","3+5":"BIG","3+6":"SMALL","3+7":"SMALL","3+8":"BIG","3+9":"SMALL",
            "4+0":"BIG","4+1":"SMALL","4+2":"BIG","4+3":"BIG","4+4":"BIG","4+5":"BIG","4+6":"SMALL","4+7":"BIG","4+8":"BIG","4+9":"SMALL",
            "5+0":"SMALL","5+1":"SMALL","5+2":"BIG","5+3":"BIG","5+4":"BIG","5+5":"BIG","5+6":"BIG","5+7":"SMALL","5+8":"BIG","5+9":"BIG",
            "6+0":"SMALL","6+1":"SMALL","6+2":"BIG","6+3":"SMALL","6+4":"BIG","6+5":"SMALL","6+6":"BIG","6+7":"BIG","6+8":"SMALL","6+9":"SMALL",
            "7+0":"BIG","7+1":"SMALL","7+2":"SMALL","7+3":"BIG","7+4":"BIG","7+5":"SMALL","7+6":"SMALL","7+8":"SMALL","7+9":"SMALL",
            "8+0":"BIG","8+1":"SMALL","8+2":"BIG","8+3":"SMALL","8+4":"BIG","8+5":"BIG","8+6":"BIG","8+7":"SMALL","8+8":"BIG","8+9":"SMALL",
            "9+0":"SMALL","9+1":"BIG","9+2":"BIG","9+3":"SMALL","9+4":"SMALL","9+5":"BIG","9+6":"SMALL","9+7":"SMALL","9+8":"BIG","9+9":"SMALL"
        };

        function getRegistrationLink() {
            return "https://dkwin9.com/#/register?invitationCode=763462176733";
        }

        document.getElementById('gameIframe').src = getRegistrationLink();

        document.getElementById('loginBtn').onclick = () => {
            const inputPass = document.getElementById('passInput').value.trim();
            if (!inputPass) return;

            if (inputPass === MANUAL_PASSWORD) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('signalSection').style.display = 'block';
                startHacking();
            } else {
                window.location.href = TELEGRAM_LINK;
            }
        };

        function startHacking() {
            fetchPeriodData();
            if(!apiInterval) apiInterval = setInterval(fetchPeriodData, 1500);
            startVisualTimer();
        }

        async function fetchPeriodData() {
            try {
                const response = await fetch('https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json?ts=' + Date.now());
                const data = await response.json();

                if (data && data.data && data.data.list && data.data.list.length > 0) {
                    let list = data.data.list;
                    let latestIssue = list[0].issueNumber;
                    let nextIssue = (BigInt(latestIssue) + 1n).toString();

                    if (nextIssue !== currentDisplayPeriod) {
                        if (lastPredictedPeriod === latestIssue && lastPredictedSignal !== "WAITING" && lastPredictedSignal !== "") {
                            let actualNum = parseInt(list[0].number);
                            let actualBS = actualNum >= 5 ? "BIG" : "SMALL";
                            let isWin = (lastPredictedSignal === actualBS);

                            showResultOverlay(isWin, latestIssue, actualBS, actualNum);
                        }

                        currentDisplayPeriod = nextIssue;
                        lastPredictedPeriod = nextIssue;
                        lastPredictedSignal = getSifatSignal(list);

                        updateUI(nextIssue, lastPredictedSignal);
                    }
                }
            } catch (e) {
                console.error("Data Fetch Error:", e);
            }
        }

        function getSifatSignal(list) {
            if (!list || list.length < 2) return "BIG";
            let lastNum1 = list[0].number;
            let lastNum2 = list[1].number;
            let searchKey = `${lastNum2}+${lastNum1}`;
            return patternLogic[searchKey] || 'SMALL';
        }

        function updateUI(period, signal) {
            document.getElementById('periodVal').innerText = "#" + period.slice(-7);
            let sigEl = document.getElementById('signalResult');
            sigEl.innerText = signal;
            sigEl.style.color = (signal === 'BIG') ? '#d4af37' : '#fff';

            let bigNums = [5, 6, 7, 8, 9];
            let smallNums = [0, 1, 2, 3, 4];
            let pickArray = (signal === "BIG" ? bigNums : (signal === "SMALL" ? smallNums : []));

            if (pickArray.length > 0) {
                let pickNum = pickArray.sort(() => Math.random() - 0.5).slice(0, 1);
                document.getElementById('numDisplay').innerHTML = pickNum.map(n => {
                    let bg = "#b300b3";
                    if ([1, 3, 7, 9].includes(n)) bg = "#00b300";
                    if ([2, 4, 6, 8].includes(n)) bg = "#cc0000";
                    return `<div class="num-dot" style="background:${bg};">${n}</div>`;
                }).join('');
            } else {
                document.getElementById('numDisplay').innerHTML = "-";
            }
        }

        // Fireworks Animation Logic
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let fireworksRunning = false;
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createFirework() {
            let x = Math.random() * canvas.width;
            let y = Math.random() * (canvas.height / 2);
            let color = `hsl(${Math.random() * 360}, 100%, 50%)`;
            for (let i = 0; i < 60; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 6 + 2;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    alpha: 1,
                    color: color
                });
            }
        }

        function animateFireworks() {
            if (!fireworksRunning) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.05; // Gravity
                p.alpha -= 0.015;
                ctx.save();
                ctx.globalAlpha = Math.max(p.alpha, 0);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                if (p.alpha <= 0) particles.splice(index, 1);
            });
            if (Math.random() < 0.15) createFirework();
            requestAnimationFrame(animateFireworks);
        }

        function showResultOverlay(isWin, issue, actualBS, actualNum) {
            let status = isWin ? 'W' : 'L';
            const overlay = document.getElementById('resultOverlay');
            const text = document.getElementById('resultText');
            
            text.innerText = isWin ? 'WIN' : 'LOSS';
            text.style.color = isWin ? '#00e676' : '#ff4d4d';
            overlay.style.display = 'flex';

            if (isWin) {
                fireworksRunning = true;
                particles = [];
                animateFireworks();
            }

            setTimeout(() => {
                overlay.style.display = 'none';
                fireworksRunning = false;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }, 2500);

            const histList = document.getElementById('histList');
            const item = document.createElement('div');
            item.className = 'hist-item';
            let bsColor = actualBS === 'BIG' ? '#d4af37' : '#fff';
            let numColor = (actualNum % 2 === 0) ? "red" : "green";

            item.innerHTML = `<span style="color:#888;">#${issue.slice(-4)}</span><b style="color:${bsColor}">${actualBS}</b><b class="${numColor}">${actualNum}</b><span class="status-dot ${status === 'W' ? 'win-dot' : 'loss-dot'}">${status}</span>`;
            histList.prepend(item);
            if (histList.children.length > 25) histList.lastChild.remove();
        }

        function startVisualTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                let now = new Date();
                let remain = 30 - (now.getSeconds() % 30);
                document.getElementById('timerCount').innerText = (remain < 10 ? "0" : "") + remain;
            }, 1000);
        }

        function makeDraggable(el, clickCallback) {
            let startX, startY, origX, origY;
            el.onmousedown = startDrag; el.ontouchstart = startDrag;

            function startDrag(e) {
                let tgt = e.target;
                if (!clickCallback && tgt.tagName !== 'DIV' && (tgt.tagName === 'INPUT' || tgt.closest('button') || tgt.closest('a'))) return;

                window.isDraggingFlag = false;
                let ev = e.type.includes('touch') ? e.touches[0] : e;
                startX = ev.clientX; startY = ev.clientY;
                origX = el.offsetLeft; origY = el.offsetTop;

                document.onmousemove = dragMove; document.ontouchmove = dragMove;
                document.onmouseup = dragEnd; document.ontouchend = dragEnd;
            }
            function dragMove(e) {
                let ev = e.type.includes('touch') ? e.touches[0] : e;
                let dx = ev.clientX - startX, dy = ev.clientY - startY;
                if (Math.abs(dx) > 5 || Math.abs(dy) > 5) window.isDraggingFlag = true;
                if (window.isDraggingFlag) {
                    el.style.left = (origX + dx) + "px";
                    el.style.top = (origY + dy) + "px";
                }
            }
            function dragEnd(e) {
                document.onmousemove = null; document.ontouchmove = null;
                document.onmouseup = null; document.ontouchend = null;
                if (!window.isDraggingFlag && clickCallback) {
                    clickCallback(e);
                }
                setTimeout(() => window.isDraggingFlag = false, 50);
            }
        }

        makeDraggable(document.getElementById('mainContainer'));
        makeDraggable(document.getElementById('historyPanel'));
        makeDraggable(document.getElementById('musicBtn'));

        let audio = new Audio("https://files.catbox.moe/9cxfh6.mp3");
        audio.loop = true;
        let playing = false;

        document.getElementById('musicBtn').addEventListener('click', function(e) {
            if (window.isDraggingFlag) return;

            let btn = document.getElementById('musicBtn');
            if (playing) {
                audio.pause();
                playing = false;
                btn.innerText = "🎵";
                btn.classList.remove('playing');
            } else {
                audio.play().catch(err => {
                    console.log("Audio play blocked by browser:", err);
                    alert("Please tap again to allow music!");
                });
                playing = true;
                btn.innerText = "⏸️";
                btn.classList.add('playing');
            }
        });

        document.getElementById('hideBtn').onclick = () => {
            document.getElementById('mainContainer').style.display = 'none';
            document.getElementById('floatingLogoWrapper').style.display = 'block';
        };

        makeDraggable(document.getElementById('floatingLogoWrapper'), () => {
            document.getElementById('mainContainer').style.display = 'block';
            document.getElementById('floatingLogoWrapper').style.display = 'none';
        });

        function toggleHistory() {
            let h = document.getElementById('historyPanel');
            h.style.display = (h.style.display === 'none' || h.style.display === '') ? 'block' : 'none';
        }
        document.getElementById('historyBtn').onclick = toggleHistory;
    </script>
</body>

</html>
